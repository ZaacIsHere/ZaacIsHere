[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemex"
version = "0.1.0"
description = "A memory + knowledge base system for Claude: spec-exact memory tool handler, just-in-time BM25 retrieval, and context editing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZaacIsHere" }]
keywords = ["claude", "anthropic", "memory", "knowledge-base", "rag", "agents", "context-editing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # core is pure stdlib

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
mnemex = "mnemex.cli:main"
mnemex-mcp = "mnemex.cli:mcp_main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemex"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
